<text x="684" y="478" fill="#365266" font-size="14">VIN / GND / SCL / SDA</text>
<text x="45" y="619" fill="#365266" font-size="16">Four short wires. Solder and insulate with power off.</text>
<text x="45" y="650" fill="#5d7485" font-size="14">The header inset is electrical guidance, not the physical pin layout.</text>
