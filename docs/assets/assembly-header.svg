<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">VibeVario - M5StickS3 and Adafruit BMP581 assembly</title>
<desc id="desc">Component-style illustration. Connect the bottom Grove port to the STEMMA QT socket, or use the separately labeled header wiring inset. Not a scale drawing.</desc>
<defs>
