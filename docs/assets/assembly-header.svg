<text x="400" y="318" fill="#172f42" font-size="15">G0</text><path d="M480 313h62" stroke="#e5b22d" stroke-width="5"/><text x="557" y="318" fill="#172f42" font-size="14">SCL</text><path d="M802 410 C802 530 530 560 530 410" fill="none" stroke="#e5b22d" stroke-width="4"/>
